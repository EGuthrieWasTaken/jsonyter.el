name: coverage

# Line coverage across both headless suites -- test/jsonyter-tests.el and
# the harness profile's tier-1 batch scenarios (harness/run-batch.sh) --
# gated at a floor so a branch protection rule can require this job to
# pass. GitHub has no native coverage-threshold check, so the threshold is
# enforced here, in the job itself, off a merged lcov report -- no
# external coverage service or token involved.
#
# The graphical harness suite (`.github/workflows/harness.yml`'s
# `scenarios' job, a real Emacs frame in a container) is NOT included:
# undercover.el instruments the process it runs in, and that job is a
# separate container this one never touches. So this number is a floor,
# not the package's true test coverage.
#
# COVERAGE_THRESHOLD tracks the combined suites' actual line coverage,
# with a small margin below it so ordinary variance (a differently-ordered
# test run, a small future refactor) doesn't flip this job red on its own.
# Raise it as coverage grows; a floor nobody can slip under is only useful
# once it is close to the truth.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_THRESHOLD: "90"
  # Same commit as harness.yml's HARNESS_REF -- bump both together, or
  # this job silently measures a different harness than CI actually tests
  # against.
  HARNESS_REF: 4756dcb841ab3888aa1022cfb642d61d5eaa7621
  HARNESS_REPO: EGuthrieWasTaken/emacs-harness

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out jsonyter.el
        uses: actions/checkout@v4

      - name: Install Emacs, lcov, and the jsonyter bridge
        # The bridge is what the tests that save a notebook drive for
        # real (test/jsonyter-tests.el's Commentary, harness/README.md);
        # without it they skip themselves, and skipped lines cannot be
        # covered.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends emacs-nox lcov
          pip install "jsonyter==2.1.1"

      - name: Install undercover.el
        # A test-only dependency pulled from MELPA at run time, not added
        # to jsonyter.el's own `Package-Requires:' header, which lists
        # what a *user* of the package needs, not what testing it needs.
        run: |
          emacs -Q --batch \
            --eval "(require 'package)" \
            --eval "(setq package-archives '((\"melpa\" . \"https://melpa.org/packages/\")))" \
            --eval "(package-initialize)" \
            --eval "(package-refresh-contents)" \
            --eval "(package-install 'undercover)"

      - name: test/jsonyter-tests.el, instrumented
        # undercover has to be armed with `(undercover ...)' before
        # `test/jsonyter-tests.el' requires jsonyter.el itself, or there is
        # nothing left for it to instrument.
        run: |
          mkdir -p coverage
          emacs -Q --batch -L . \
            --eval "(package-initialize)" \
            --eval "(require 'undercover)" \
            --eval "(undercover \"jsonyter.el\" (:report-format 'lcov) (:report-file \"coverage/lcov.info\") (:send-report nil))" \
            -l test/jsonyter-tests.el \
            -f ert-run-tests-batch-and-exit

      - name: Check out emacs-harness
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HARNESS_REPO }}
          ref: ${{ env.HARNESS_REF }}
          path: .harness

      - name: harness/run-batch.sh, instrumented
        # EH_BATCH_PRELOAD (harness/run-batch.sh) is the hook that lets
        # this arm undercover before the profile's init.el requires
        # jsonyter.el, without putting coverage tooling inside init.el
        # itself -- that file is deliberately only what a user's config
        # or the harness needs, nothing CI-specific.
        run: |
          cat > coverage/harness-preload.el <<'EL'
          (package-initialize)
          (require 'undercover)
          (undercover "jsonyter.el"
                      (:report-format 'lcov)
                      (:report-file "coverage/lcov-harness.info")
                      (:send-report nil))
          EL
          EH_BATCH_PRELOAD="$PWD/coverage/harness-preload.el" \
            harness/run-batch.sh --harness .harness

      - name: Merge coverage from both suites
        run: lcov -a coverage/lcov.info -a coverage/lcov-harness.info -o coverage/lcov-combined.info

      - name: Enforce line coverage >= ${{ env.COVERAGE_THRESHOLD }}%
        run: |
          lcov --summary coverage/lcov-combined.info | tee coverage/summary.txt
          python3 - "$COVERAGE_THRESHOLD" <<'PY'
          import re, sys
          threshold = float(sys.argv[1])
          text = open("coverage/summary.txt").read()
          match = re.search(r"lines\.+:\s*([\d.]+)%", text)
          if not match:
              print("could not find a line-coverage percentage in lcov's summary")
              sys.exit(1)
          pct = float(match.group(1))
          print(f"line coverage: {pct}% (threshold {threshold}%)")
          if pct < threshold:
              print(f"::error::line coverage {pct}% is below the required {threshold}%")
              sys.exit(1)
          PY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
