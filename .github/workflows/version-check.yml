name: version

# release.yml already enforces that a *release tag* matches the ';;
# Version:' header at release time -- but by then the number has already
# merged. This runs at review time instead: every pull request touching
# jsonyter.el must bump that header to a value that has never appeared
# in the file's history before, so a merge can never produce two
# different commits claiming the same version.
#
# "Never appeared before" is checked against every version the header
# ever held on a commit reachable from the PR's *base* -- i.e. every
# version that existed before this PR -- plus every `vX.Y.Z' release
# tag, in case a header and its tag ever drifted apart. Deliberately
# rooted at the base commit rather than at the checked-out merge: `git
# log -- jsonyter.el' treats a clean, non-conflicting merge as
# TREESAME to the side that changed the file and does not list the
# merge commit itself, so the commit that actually shows up is the PR's
# own bump commit -- which of course already carries the new version.
# Walking from HEAD and excluding only the merge commit's own hash
# still counts the PR's own commit as "history" and flags every PR as
# reusing its own version; walking from the base sidesteps that
# entirely, since the PR's own commits are never reachable from there.

on:
  pull_request:
    paths:
      - jsonyter.el
      - README.md

permissions:
  contents: read

jobs:
  version-is-new:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the merged PR, full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ";; Version: header must not reuse a version that already exists"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          extract() {
            # `tr -d' also eats the line's own trailing newline, so it is
            # added back explicitly -- otherwise every call below runs
            # together into one unseparated line once looped.
            sed -n 's/^;;[[:space:]]*Version:[[:space:]]*//p' | head -n1 | tr -d '[:space:]'
            printf '\n'
          }

          current="$(extract < jsonyter.el)"
          if [ -z "$current" ]; then
            echo "::error file=jsonyter.el::no ';; Version:' header found"
            exit 1
          fi
          echo "this PR's version: $current"

          used="$(mktemp)"
          git log --format='%H' "$BASE_SHA" -- jsonyter.el | while read -r sha; do
            git show "$sha:jsonyter.el" 2>/dev/null | extract
          done > "$used"

          # Release tags too, in case a header and its tag ever drifted.
          git tag -l 'v*' | sed 's/^v//' >> "$used"
          sort -u -o "$used" "$used"

          echo "versions that existed before this PR:"
          cat "$used"

          if grep -qxF "$current" "$used"; then
            echo "::error file=jsonyter.el::';; Version: $current' has already been used in this repository's history -- bump it to a value that has never appeared before."
            exit 1
          fi

          echo "OK: $current has not been used before"

  readme-versions-match:
    # README.md pins jsonyter.el's own release tag in three install
    # examples (the manual curl download, package-vc-install's :rev,
    # elpaca's :ref) so a reader can copy-paste something that actually
    # works. Nothing else keeps those in sync with a release -- this PR's
    # own header bump is what makes the header the *next* tag, so that is
    # what README.md is checked against here, not the latest tag already
    # published (which would still be correct once this merges and gets
    # tagged, but would falsely flag every version-bump PR in the window
    # before that tagging happens).
    runs-on: ubuntu-latest
    steps:
      - name: Check out the merged PR
        uses: actions/checkout@v4

      - name: "README.md's jsonyter.el release-tag references must match the ';; Version:' header"
        run: |
          set -euo pipefail

          current="$(sed -n 's/^;;[[:space:]]*Version:[[:space:]]*//p' jsonyter.el | head -n1 | tr -d '[:space:]')"
          if [ -z "$current" ]; then
            echo "::error file=jsonyter.el::no ';; Version:' header found"
            exit 1
          fi
          echo "jsonyter.el's own version: $current"

          fail=0

          check_pattern() {
            label="$1" pattern="$2"
            matches="$(grep -noE "$pattern" README.md || true)"
            if [ -z "$matches" ]; then
              echo "::warning file=README.md::no '$label' reference found to check -- has this section moved or been reworded?"
              return
            fi
            while IFS= read -r m; do
              line="${m%%:*}"
              found="$(printf '%s' "$m" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
              if [ "$found" != "$current" ]; then
                echo "::error file=README.md,line=$line::$label pins jsonyter.el to v$found, but the current ';; Version:' header is $current -- update this (and every other reference still reading v$found) to v$current."
                fail=1
              fi
            done <<EOF
          $matches
          EOF
          }

          check_pattern "the curl download URL" 'EGuthrieWasTaken/jsonyter\.el/v[0-9]+\.[0-9]+\.[0-9]+/jsonyter\.el'
          check_pattern "package-vc-install's :rev" ':rev "v[0-9]+\.[0-9]+\.[0-9]+"'
          check_pattern "elpaca's :ref" ':ref "v[0-9]+\.[0-9]+\.[0-9]+"'

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "OK: every jsonyter.el release-tag reference in README.md matches v$current"
